# Otomatik release:
#   version.py içindeki sürüm değişip main'e push edildiğinde (ya da Actions'tan elle başlatıldığında)
#   -> testler -> o sürümün etiketi yoksa: Windows .exe -> ZIP -> etiket vX.Y.Z + GitHub Release
#   Etiket zaten varsa hiçbir şey yapılmaz (aynı sürüm iki kez yayınlanmaz).
name: Release
on:
  push:
    branches: [main]
    paths:
      - version.py
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sürümü oku, daha önce yayınlandı mı?
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          git fetch --tags --quiet
          if (git tag --list "v$v") {
            Write-Host "v$v zaten yayınlanmış – atlanıyor."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Bağımlılıklar ve testler
        if: steps.ver.outputs.skip == 'false'
        run: |
          pip install -r requirements.txt
          python -m pytest -q tests

      - name: exe oluştur
        if: steps.ver.outputs.skip == 'false'
        run: >
          pyinstaller --noconfirm --windowed --name BnX-Raptor
          --hidden-import win32com.client --hidden-import pythoncom main.py

      - name: ZIP paketle (config.json YOK – büro ayarları korunur)
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          Copy-Item config.example.json dist/BnX-Raptor/
          Compress-Archive -Path dist/BnX-Raptor -DestinationPath "BnX-Raptor-v${{ steps.ver.outputs.version }}.zip"

      - name: Etiket + GitHub Release
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BnX-Raptor ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG-aktuell.md
          files: BnX-Raptor-*.zip
          fail_on_unmatched_files: true
